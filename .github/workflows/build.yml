name: Build YuJian APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# softprops/action-gh-release 需要写权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # 未配置 secret 时这里是空字符串，后续步骤用 if 判断跳过
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不使用 android-actions/setup-android@v3：该 action 内部会执行 `sdkmanager tools`，
      # 而 Google 已把 legacy 的 `tools` 包从 SDK 仓库下架，会直接报
      # "Warning: Failed to find package 'tools'" 并让整个 job 失败。
      # ubuntu-latest 镜像已预装 Android SDK + cmdline-tools 且 license 已接受，只需补装目标平台。
      - name: Ensure Android SDK 34
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager)"
          fi
          echo "sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "platform 34 就绪"

      # 仓库不含 gradle-wrapper.jar（二进制不入库），因此用 setup-gradle 提供 Gradle 8.7 并直接调用 gradle
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Decode keystore (optional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # 没有配置签名 secret 时，build.gradle.kts 会自动回退 debug 签名，job 不会失败
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      # 统一输出 YuJian-release.apk（同时保留 TVNotify-release.apk 别名保持向下兼容）
      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          echo "Found APK: $SRC"
          cp "$SRC" dist/YuJian-release.apk
          cp "$SRC" dist/TVNotify-release.apk
          ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YuJian-release
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
